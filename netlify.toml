[build]
  publish = "site"

[[headers]]
  for = "/bots/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
